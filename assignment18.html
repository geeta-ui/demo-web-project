<html>
<head>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; text-align: center; }
    </style>
</head>
<body>
    <header style="background-color: navy; color: white; text-align: center; padding: 10px;">
        <h1>ABC College Admission 2026</h1>
    </header>

    <section>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </table>
    </section>

    <section>
        <form>
            <fieldset>
                <legend>Application Form</legend>
                <label>Name:</label><br>
                <input type="text"><br><br>

                <label>Email:</label><br>
                <input type="email"><br><br>

                <label>Course:</label><br>
                <select>
                    <option>B.Tech CSE</option>
                </select><br><br>

                <label>Statement:</label><br>
                <textarea></textarea><br><br>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </section>

    <footer style="background-color: navy; color: white; text-align: center; padding: 10px;">
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
